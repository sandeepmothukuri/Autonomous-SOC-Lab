# =============================================================================
# Detection: Suspicious PowerShell Execution
#
# Triggers on Vector-tagged critical/high-severity PowerShell events, not on
# every PowerShell invocation. The Vector pipeline sets event.severity =
# critical/high only when EncodedCommand, DownloadString/WebClient, IEX, or
# ExecutionPolicy Bypass are observed in Script Block logging (EventID 4104).
#
# MITRE ATT&CK:
#   tactic   : execution (primary) / defense-evasion (bypass)
#   technique: T1059.001 PowerShell
#
# False-positive considerations:
#   - Legitimate administrative scripts may legitimately use DownloadString
#     for package installation. Pair with source.ip/parent process in
#     production tuning.
# =============================================================================

name: "Suspicious PowerShell Execution"
type: any

index: logs-*

filter:
  - bool:
      must:
        - term:
            event.type: "powershell_execution"
        - bool:
            should:
              - term:
                  alert.rule: "powershell_encoded_command"
              - term:
                  alert.rule: "powershell_download_cradle"
              - term:
                  alert.rule: "powershell_executionpolicy_bypass"
            minimum_should_match: 1

realert:
  minutes: 5

alert:
  - post

http_post_url: "http://stackstorm:9101/v1/webhooks/elastalert"
http_post_payload:
  host_name: "host.name"
  user_name: "user.name"
  script_block: "process.command_line"
  command_line: "process.command_line"
  source_ip: "source.ip"
  severity: "event.severity"
http_post_static_payload:
  alert_name: "Suspicious PowerShell Execution"
  alert_id: "powershell-t1059-001"
  severity: "critical"
  mitre_tactic: "execution"
  mitre_technique: "T1059.001"
http_post_headers:
  Content-Type: "application/json"
  X-SOC-Source: "elastalert"

alert_text: |
  SUSPICIOUS POWERSHELL EXECUTION
  Host:          {host.name}
  User:          {user.name}
  Source IP:     {source.ip}
  Script Block:  {process.command_line}
  MITRE ATT&CK:  T1059.001 (PowerShell)
  Severity:      CRITICAL

  Indicators:
  - Encoded command (-Enc / -EncodedCommand)
  - Download cradle (DownloadString / WebClient / IEX)
  - Execution policy bypass

alert_text_type: alert_text_only

include:
  - host.name
  - user.name
  - process.command_line
  - source.ip
  - event.severity
  - alert.rule

timestamp_field: "@timestamp"
