# =============================================================================
# Detection: Suspicious PowerShell Execution
# MITRE ATT&CK: T1059.001 — PowerShell
# Severity: Critical
# Author: SOC Lab
# =============================================================================

name: Suspicious PowerShell Execution
type: any

index: logs-*

filter:
  - bool:
      must:
        - term:
            event.type: "powershell_execution"
        - bool:
            should:
              - query_string:
                  query: "powershell.script_block_text:(*-Enc* OR *-EncodedCommand* OR *IEX* OR *Invoke-Expression* OR *DownloadString* OR *WebClient* OR *bypass*)"
              - term:
                  winlog.event_id: 4104

realert:
  minutes: 5

alert:
  - post

http_post_url: "http://stackstorm:9101/v1/webhooks/elastalert"
http_post_payload:
  host_name: host.name
  user_name: winlog.event_data.SubjectUserName
  script_block: powershell.script_block_text
  command_line: process.command_line
  source_ip: source.ip
http_post_static_payload:
  alert_name: "Suspicious PowerShell Execution"
  alert_id: "powershell-t1059-001"
  severity: "critical"
  mitre_technique: "T1059.001"
http_post_headers:
  Content-Type: "application/json"
  X-SOC-Source: "elastalert"

alert_text: |
  🚨 CRITICAL: SUSPICIOUS POWERSHELL DETECTED

  Host:     {host.name}
  User:     {winlog.event_data.SubjectUserName}
  Script:   {powershell.script_block_text}

  MITRE ATT&CK: T1059.001 (PowerShell)
  Severity: CRITICAL

  Script block flagged for:
  - Encoded commands (-Enc / -EncodedCommand)
  - Download cradles (DownloadString / WebClient)
  - Execution policy bypass

alert_text_type: alert_text_only

include:
  - host.name
  - winlog.event_data.SubjectUserName
  - powershell.script_block_text
  - winlog.event_id
  - process.command_line
