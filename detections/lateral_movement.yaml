# =============================================================================
# Detection: Lateral Movement via SMB / PsExec / SSH
# MITRE ATT&CK: T1021 — Remote Services
# Severity: High
# Author: SOC Lab
# =============================================================================

name: Lateral Movement Detected
type: frequency

index: logs-*

# 3+ distinct internal hosts accessed in 5 min = lateral movement
num_events: 3
timeframe:
  minutes: 5

query_key: source.ip

filter:
  - bool:
      must:
        - bool:
            should:
              - term:
                  destination.port: 445
              - term:
                  destination.port: 22
              - term:
                  destination.port: 3389
        - term:
            network.direction: "internal"

realert:
  minutes: 20

alert:
  - post

http_post_url: "http://stackstorm:9101/v1/webhooks/elastalert"
http_post_payload:
  source_ip: source.ip
  destination_ip: destination.ip
  destination_port: destination.port
  network_direction: network.direction
  count: num_matches
http_post_static_payload:
  alert_name: "Lateral Movement Detected"
  alert_id: "lateral-movement-t1021"
  severity: "high"
  mitre_technique: "T1021"
http_post_headers:
  Content-Type: "application/json"
  X-SOC-Source: "elastalert"

alert_text: |
  🔴 LATERAL MOVEMENT DETECTED

  Source IP:    {source.ip}
  Destinations: {count} unique internal hosts
  Protocol:     {destination.port}
  Timeframe:    5 minutes

  MITRE ATT&CK: T1021
  Severity: HIGH

alert_text_type: alert_text_only
