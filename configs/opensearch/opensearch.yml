# OpenSearch Single-Node Configuration
# Autonomous SOC Lab — Production-grade settings

cluster.name: autonomous-soc-cluster
node.name: soc-node-01

# Network
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# Discovery (single-node)
discovery.type: single-node

# Security — disabled for lab (enable in production)
plugins.security.disabled: true

# Memory & Performance
bootstrap.memory_lock: true
indices.memory.index_buffer_size: 20%
indices.queries.cache.size: 15%

# Index lifecycle
action.auto_create_index: true
action.destructive_requires_name: false

# Logging
logger.level: INFO

# Paths
path.data: /usr/share/opensearch/data
path.logs: /usr/share/opensearch/logs

# Shard settings (single-node optimised)
index.number_of_shards: 1
index.number_of_replicas: 0

# Thread pool — tuned for SOC ingest workload
thread_pool.write.queue_size: 500
thread_pool.search.queue_size: 500

# HTTP settings
http.max_content_length: 500mb
http.cors.enabled: true
http.cors.allow-origin: "*"
http.cors.allow-headers: "X-Requested-With,Content-Type,Content-Length,Authorization"
