# -----------------------------------------------------------------------------
# OpenSearch Dashboards — Autonomous SOC Lab
# Security plugin disabled to match OpenSearch.
# -----------------------------------------------------------------------------

server.host: "0.0.0.0"
server.port: 5601
server.name: "soc-dashboards"

opensearch.hosts: ["http://opensearch:9200"]
opensearch.requestHeadersWhitelist: [authorization, securitytenant]
opensearch_security.disabled: true
opensearch.ssl.verificationMode: none

# UI / telemetry
newsfeed.enabled: false
telemetry.enabled: false
telemetry.optIn: false
opensearchDashboards.defaultAppId: "dashboards"
opensearchDashboards.index: ".opensearch_dashboards"

logging.root.level: info
