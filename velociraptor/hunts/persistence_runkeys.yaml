# Velociraptor VQL hunt — Run-key persistence
name: SOC-Lab.RunKeyPersistence
description: Enumerate well-known Windows persistence run keys.
sources:
  - query: |
        SELECT Name, Data, Type FROM read_reg_key(
           globs=('HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\*',
                  'HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\*'))
